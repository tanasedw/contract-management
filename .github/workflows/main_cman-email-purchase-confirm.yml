# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - cman-email-purchase-confirm

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.12'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: .python_packages
          key: ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d ".python_packages/lib/site-packages" ]; then
            pip install --target=".python_packages/lib/site-packages" -r requirements.txt
            find .python_packages -type d -name "tests"       -exec rm -rf {} + 2>/dev/null; true
            find .python_packages -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null; true
            find .python_packages -name "*.pyc" -delete 2>/dev/null; true
            find .python_packages -name "*.pyo" -delete 2>/dev/null; true
          fi

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'cman-email-purchase-confirm'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4C920399A69A4682A381AB19670398B2 }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
